<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <title>Naar Notion</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <main class="pane">
    <header class="head">
      <img src="assets/icon-32.png" alt="" width="24" height="24">
      <div>
        <h1>Naar Notion</h1>
        <p class="subject" id="subject">Mail laden...</p>
      </div>
    </header>

    <section id="done" class="done" hidden>
      <div class="done-row">
        <span class="check" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 10.5l3.2 3.2L15 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <strong id="doneText">Staat klaar voor Eva</strong>
          <p id="doneNote" class="done-note" hidden></p>
        </div>
      </div>
      <button type="button" id="undo" class="undo">Ongedaan maken</button>
    </section>


    <p class="label" id="laneLabel">Kies een lane</p>
    <div class="lanes" id="lanes" role="group" aria-labelledby="laneLabel"></div>

    <label class="field field-bottom">
      <span>Notitie voor Eva <em>(optioneel)</em></span>
      <textarea id="note" rows="2" maxlength="500" placeholder="Bijv. reactie sturen voor vrijdag, of bij On hold: wacht op Bas, contract tekenen"></textarea>
    </label>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="taskpane.js"></script>
</body>
</html>
