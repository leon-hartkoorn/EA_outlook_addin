<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <title>EA Inbox Management</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=12">
</head>
<body>
  <main class="pane">
    <header class="head">
      <img src="assets/icon-32.png" alt="" width="16" height="16">
      <h1 class="subject" id="subject">Mail laden...</h1>
    </header>

    <section id="recent" class="recent" hidden>
      <p id="recentText"></p>
      <button type="button" id="recentUndo" class="undo">Ongedaan maken</button>
    </section>

    <section id="triage" class="triage" hidden aria-labelledby="triageTitle">
      <div class="triage-head">
        <span class="kind-tag" id="triageKind" hidden></span>
        <span class="eva-badge" id="triageTitle">EA</span>
        <span id="triageAt" class="triage-at"></span>
      </div>
      <p id="triageSummary" class="triage-summary"></p>
      <p id="triageContext" class="triage-context" hidden></p>
      <div id="triageActions">
        <button type="button" id="triagePrimary" class="btn-primary"></button>
        <p id="triageReason" class="triage-reason" hidden></p>
        <div id="triageAlts" class="triage-alts"></div>
      </div>
      <div id="triageState" class="triage-state" hidden>
        <strong id="triageStateText"></strong>
        <button type="button" id="triageUndo" class="undo">Ongedaan maken</button>
      </div>
    </section>
    <p id="noTriage" class="no-triage" hidden>Nog geen triage voor deze mail</p>
    <button type="button" id="diag" class="btn-alt" hidden>Test</button>

    <section id="done" class="done" hidden>
      <div class="done-row">
        <span class="check" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 10.5l3.2 3.2L15 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <strong id="doneText">Staat klaar voor EA</strong>
          <p id="doneNote" class="done-note" hidden></p>
        </div>
      </div>
      <button type="button" id="undo" class="undo">Ongedaan maken</button>
    </section>


    <p class="label" id="laneLabel">Taak in Notion</p>
    <div class="lanes" id="lanes" role="group" aria-labelledby="laneLabel"></div>

    <label class="field field-bottom">
      <span>Notitie voor EA <em>(optioneel)</em></span>
      <textarea id="note" rows="2" maxlength="500" placeholder="Bijv. reactie voor vrijdag, of: wacht op Bas"></textarea>
    </label>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="ver">versie 12</p>
  </main>
  <script src="taskpane.js?v=12"></script>
</body>
</html>
